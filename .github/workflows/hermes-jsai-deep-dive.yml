name: Hermes JSAI Deep Dive

on:
  schedule:
    # GitHub Actions cron is UTC. 00:17 UTC Tue/Fri = 09:17 JST Tue/Fri.
    - cron: "17 0 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  run-hermes-jsai:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Hermes JSAI deep dive
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash-lite' }}
          CREATE_GITHUB_ISSUE: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/hermes_run.py --mode jsai

      - name: Commit Hermes output
        run: |
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@users.noreply.github.com"
          git add outputs memory
          git commit -m "Hermes JSAI deep dive" || echo "No changes to commit"
          git push

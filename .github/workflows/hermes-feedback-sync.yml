name: Hermes Feedback Sync

on:
  schedule:
    # GitHub Actions cron is UTC. 22:57 UTC = 07:57 JST, before the daily radar.
    - cron: "57 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  sync-feedback:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest Hermes issue feedback
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/hermes_feedback.py

      - name: Commit feedback memory
        run: |
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@users.noreply.github.com"
          git add memory/post_feedback.csv
          git commit -m "Update Hermes feedback memory" || echo "No feedback changes to commit"
          git push
